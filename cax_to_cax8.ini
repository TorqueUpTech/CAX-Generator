;
; V7->V8 user defined calibration conversion meta data
;
; Use this file to provide additional meta data when 
; converting V7 *.cax files to v8 *.cax8 files.
;
; The V7 *.cax filename is the key, followed by an = sign.
;
; Use double quotes around any vlaue that contains spaces or commas.
;
; Controller: the name of the controller for which the cax file was designed.
;             use . to have the conversion process automatically look up the controller name.
;
; cax8:       the name of the cax8 output file.
;             use . to make the cax8 output filename the same as the v7 cax file name.
;
; Provider:   the name of the provider of the cax8 file.
;             use . to leave  blank.
;
; Unique ID:  the Unique ID for  the cax8 file.
;             use . for the default Unique ID ( U01, U02, U03, etc).
;
; URL:        the web site of the provider of the cax8 file.
;             use . to leave blank.
;
; Contact:    the email contact of the provider of the cax8 file.
;             use . to leave  blank.

[CONVERSION]
;--------------------- ----------- ---------------------- ------------------- --------- --------------------------------------- ---------------------------------------
; V7 cax Name          Controller  V8 cax8 Name           Provider Name       Unique ID URL                                     Contact
;--------------------- ----------- ---------------------- ------------------- --------- --------------------------------------- ---------------------------------------
;Example:
12345678.cax =         E38         12345678.cax8          "Acme Corp"         ACM       www.acme.com                            support@acme.com
